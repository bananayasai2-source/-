<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学食残高チェッカー</title>
<link rel="manifest" href="manifest.json">


  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

<button
  class="settings-button"
  onclick="location.href='setting.html'"
>
  ⚙
</button>


    <h1>学食残高</h1>

    

    <div class="balance" id="balance">
      残高: 0円
    </div>

    <div class="meal-count" id="meal">
      あと0食
    </div>


 <h2>学食</h2>

<button class="meal-button" onclick="eatMeal()">
  食べた 
</button>

<h2>チャージ</h2>

<button class="charge-button" onclick="charge(1000)">
  +1000円
</button>

<button class="charge-button" onclick="charge(2000)">
  +2000円
</button>

<button class="charge-button" onclick="charge(3000)">
  +3000円
</button>

<button class="charge-button" onclick="charge(5000)">
  +5000円
</button>

  </div>

  <script src="script.js"></script>

</body>
</html>
